name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run eslint
      - run: npm run prettier -- --check
      - run: npm test
      - name: Package size and content check
        run: |
          npm pack --dry-run
          TARBALL=$(npm pack)
          SIZE=$(wc -c < "$TARBALL" | tr -d ' ')
          echo "Tarball size: $SIZE bytes"
          # Ensure package size stays strictly under 250KB budget
          if [ "$SIZE" -gt 256000 ]; then
            echo "Package size budget exceeded: $SIZE bytes > 256000 bytes"
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run Android Lint, Unit Tests, and Compile
        working-directory: android
        run: ./gradlew lint test compileDebugJavaWithJavac --no-daemon

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install Pods
        working-directory: ios
        run: pod install
      - name: Run iOS XCTest
        working-directory: ios
        run: |
          xcodebuild test \
            -workspace Plugin.xcworkspace \
            -scheme Plugin \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO
